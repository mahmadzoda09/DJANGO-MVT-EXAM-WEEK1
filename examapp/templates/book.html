<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #F7F5F0;
            color: #171F1B;
        }

        .wrap {
            max-width: 640px;
            margin: 0 auto;
            padding: 72px 24px 80px;
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 2.2rem;
            letter-spacing: -0.01em;
            border-bottom: 2px solid #171F1B;
            padding-bottom: 18px;
            margin-bottom: 8px;
        }

        .book-list {
            display: flex;
            flex-direction: column;
        }

        .book-row {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 4px;
            border-bottom: 1px solid #DAD6C8;
            text-decoration: none;
            color: inherit;
            border-left: 3px solid transparent;
            transition: border-left-color 0.15s ease, padding-left 0.15s ease;
        }

        .book-row:hover {
            border-left-color: #24463B;
            padding-left: 14px;
        }

        .book-icon {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border: 1px solid #DAD6C8;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 1.1rem;
            color: #24463B;
        }

        .book-title {
            font-family: 'Fraunces', serif;
            font-weight: 500;
            font-size: 1.15rem;
            flex: 1;
            min-width: 0;
        }

        .book-arrow {
            font-size: 1.1rem;
            color: #6B6A63;
            flex-shrink: 0;
        }

        .actions {
            display: flex;
            gap: 14px;
            margin-top: 36px;
        }

        .actions a {
            text-decoration: none;
        }

        .actions button {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            background: #24463B;
            color: #F7F5F0;
            border: none;
            padding: 12px 28px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .actions button:hover {
            background: #171F1B;
        }

        @media (max-width: 560px) {
            .wrap {
                padding: 48px 20px 60px;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
    <h1>Welcome to Books page!</h1>

    <div class="book-list">
    {% for book in books %}
    <a href="{% url 'detail' book.id%}" class="book-row">
        <div class="book-icon">{{book.title|first}}</div>
        <div class="book-title">{{book.title}}</div>
        <div class="book-arrow">→</div>
    </a>
    {% endfor %}
    </div>

    <div class="actions">
    <a href="{% url 'main'%}"><button>Main</button></a>
    <a href="{% url 'add'%}"><button>Add Book</button></a>
    </div>
    </div>
</body>
</html>
