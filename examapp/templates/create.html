<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #F7F5F0;
            color: #171F1B;
        }

        .wrap {
            max-width: 640px;
            margin: 0 auto;
            padding: 72px 24px 80px;
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 2.2rem;
            letter-spacing: -0.01em;
            border-bottom: 2px solid #171F1B;
            padding-bottom: 18px;
            margin-bottom: 32px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label b {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #A8721C;
        }

        input {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: #171F1B;
            background: #fff;
            border: 1px solid #DAD6C8;
            padding: 10px 12px;
            margin-top: 6px;
            width: 100%;
        }

        input:focus {
            outline: none;
            border-color: #24463B;
        }

        .field {
            margin-bottom: 22px;
        }

        button[type="submit"] {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            background: #24463B;
            color: #F7F5F0;
            border: none;
            padding: 12px 28px;
            cursor: pointer;
            align-self: flex-start;
            transition: background 0.15s ease;
        }

        button[type="submit"]:hover {
            background: #171F1B;
        }

        @media (max-width: 560px) {
            .wrap {
                padding: 48px 20px 60px;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
    <h1>Create Author</h1>
    <form action="" method="POST">
        {% csrf_token %}
        <div class="field">
        <label><b>First Name</b></label><br>
        <input type="text" name="first_name" style="outline: none;">
        </div>
        <div class="field">
        <label><b>Last Name</b></label><br>
        <input type="text" name="last_name" style="outline: none;">
        </div>
        <div class="field">
        <label><b>Birth Date</b></label><br>
        <input type="text" name="birth_date" style="outline: none;">
        </div>
        <button type="submit">Save</button>
    </form>
    </div>
</body>
</html>
