<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #F7F5F0;
            color: #171F1B;
        }

        .wrap {
            max-width: 640px;
            margin: 0 auto;
            padding: 72px 24px 80px;
        }

        .masthead {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 2px solid #171F1B;
            padding-bottom: 18px;
            margin-bottom: 8px;
        }

        .masthead h1 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 2.2rem;
            letter-spacing: -0.01em;
        }

        .masthead span {
            font-size: 0.8rem;
            color: #6B6A63;
        }

        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #A8721C;
            font-weight: 600;
            margin: 36px 0 4px;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
        }

        a.menu-row {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 4px;
            border-bottom: 1px solid #DAD6C8;
            text-decoration: none;
            color: inherit;
            border-left: 3px solid transparent;
            transition: border-left-color 0.15s ease, padding-left 0.15s ease;
        }

        a.menu-row:hover {
            border-left-color: #24463B;
            padding-left: 14px;
        }

        .menu-icon {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border: 1px solid #DAD6C8;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 1.1rem;
            color: #24463B;
        }

        .menu-main {
            flex: 1;
            min-width: 0;
        }

        .menu-name {
            font-family: 'Fraunces', serif;
            font-weight: 500;
            font-size: 1.15rem;
            margin-bottom: 3px;
        }

        .menu-description {
            font-size: 0.85rem;
            color: #6B6A63;
            line-height: 1.4;
        }

        .menu-arrow {
            font-size: 1.1rem;
            color: #6B6A63;
            flex-shrink: 0;
        }

        @media (max-width: 560px) {
            .wrap {
                padding: 48px 20px 60px;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="masthead">
            <h1>WELCOME!</h1>
            <span>International Library</span>
        </div>

        <div class="section-label">Browse</div>
        <div class="menu-list">
            <a href="{% url 'author'%}" class="menu-row">
                <div class="menu-icon">A</div>
                <div class="menu-main">
                    <div class="menu-name">View Authors</div>
                    <div class="menu-description">Browse all authors in the library</div>
                </div>
                <div class="menu-arrow">→</div>
            </a>
            <a href="{% url 'book'%}" class="menu-row">
                <div class="menu-icon">B</div>
                <div class="menu-main">
                    <div class="menu-name">Our Books</div>
                    <div class="menu-description">Explore the full book collection</div>
                </div>
                <div class="menu-arrow">→</div>
            </a>
        </div>
    </div>
</body>
</html>
